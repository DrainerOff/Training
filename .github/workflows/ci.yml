name: Tests and publish

# Every push to main or the working branch: run all tests, then publish app/ to the
# gh-pages branch (GitHub Pages → "Deploy from a branch" → gh-pages / root).
on:
  push:
    branches: [main, claude/strength-tracker-pwa]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and Apps Script tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (iPhone emulation, offline relaunch)
        run: npm run test:e2e

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the site (stamp the release into the service worker and Settings)
        run: |
          mkdir _site
          cp -R app/. _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/sw.js _site/js/main.js
          grep -q "${GITHUB_SHA::7}" _site/sw.js
          touch _site/.nojekyll
      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
